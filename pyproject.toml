[project]
name = "libraclub"
version = "0.1.0"
description = "LibraClub — vertical de complejos deportivos de la familia Libra"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    # El auth de toda la familia. Se declara con `git+https` a proposito: asi
    # anda en dev local sin identidad SSH propia. Cuando la familia pase a
    # repos privados, el build reescribe la URL a `git+ssh` con la deploy key
    # de solo lectura del motor.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.33.0",
    # Entra en F1 sólo por `respaldo`: una instancia sin backup no se puede
    # poner en produccion. Su alcance crece en F2 (`mp_api`, `pdf_generator`)
    # y F3 (ARCA) — ver ARCHITECTURE.md.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.41.0",
    # De LibraGenda se consume DOMINIO PURO, no persistencia: la recurrencia de
    # las canchas fijas y el solapamiento de intervalos. El motivo de no usar
    # sus repositorios esta en DECISIONS.md ADR-004.
    "libragenda @ git+https://github.com/marianocappucci/libragenda.git@v0.9.0",
    # El buffet (F4): catalogo, stock y ventas. Se consume el motor entero
    # —dominio, casos de uso y repositorio SQLite/PostgreSQL— y no solo el
    # dominio como en LibraGenda: aca no hay una persistencia propia que valga
    # la pena escribir, y VentaLibra ya probo ese camino.
    "libracommerce @ git+https://github.com/marianocappucci/libracommerce.git@v0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
]

[tool.pytest.ini_options]
markers = [
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
]
testpaths = ["tests"]
addopts = "-q"
