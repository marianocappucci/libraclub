[project]
name = "libraclub"
version = "0.1.0"
description = "LibraClub — vertical de complejos deportivos de la familia Libra"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    # El auth de toda la familia. Se declara con `git+https` a proposito: asi
    # anda en dev local sin identidad SSH propia. Cuando la familia pase a
    # repos privados, el build reescribe la URL a `git+ssh` con la deploy key
    # de solo lectura del motor.
    #
    # v0.38.0 -> v0.40.0 (2026-09-12): el captcha ALTCHA del login
    # (`captcha=True`, ADR-014) y, de paso, la IP real en el bloqueo por
    # intentos (v0.39.0). Trae `altcha` como dependencia.
    # v0.40.0 -> v0.43.0 (ADR-018): `libraauth.usuarios.build_users_router()`,
    # el router de usuarios único de la familia -- ver `app/routers/usuarios.py`.
    # Trae también la sesión por inactividad de 8h con renovación deslizante
    # (ADR-017).
    # v0.48.0 -> v0.49.0 (2026-10-12): `registrador_dbapi` y el formato del log en funciones puras (ADR-022). Sin migracion.
    # v0.49.0 -> v0.50.0 (2026-10-13, ADR-023): `UsadosEnBase`, el anti-replay del captcha en la base (varios procesos). **Con migracion** (`0003_captcha_usados`): el arranque la exige (`exigir_schema_al_dia`), asi que `libraauth-migrar upgrade` corre antes de uvicorn.
    # v0.50.0 -> v0.51.0 (2026-10-15, ADR-024): el responsable acepta por adelantado la proxima version de los Terminos (`GET /terminos` suma `proxima`, `POST /aceptar` acepta la vigente o la proxima). Sin migracion; el aviso pide libra-ui v0.153.0.
    "libraauth[migrations] @ git+https://github.com/marianocappucci/libraauth.git@v0.51.0",
    # Entra en F1 sólo por `respaldo`: una instancia sin backup no se puede
    # poner en produccion. Su alcance crece en F2 (`mp_api`, `pdf_generator`)
    # y F3 (ARCA) — ver ARCHITECTURE.md.
    #
    # v1.41.0 -> v1.48.0 (2026-08-24): **el deploy corre las migraciones**. Es
    # la razón del bump, no un alineamiento de versión: `cmd_actualizar` ahora
    # ejecuta `ProductConfig.migraciones` con `compose run --rm` antes del
    # `up -d`, y este producto lo declara en sus dos `configure()`. Sin esta
    # versión esa clave no existe y `configure()` levanta `TypeError` — o sea
    # que el pin y la declaración viajan juntos o no viajan.
    #
    # 🔑 Lo pidió **este mismo producto**: la revisión `0008` del cobro con QR
    # llegó a `main` sin nadie en el camino de deploy que la aplicara.
    #
    # v1.97.0 -> v1.98.0 (2026-09-13): cierre diario por sucursal (Fase 1, el
    # motor — ADR-011): `db.cierre_diario`, `arqueo_de_turno()`,
    # `caja_router.build_cierre_diario_router()` y el ticket térmico de 80 mm
    # del cierre y del turno. Trae la migración `0009_cierre_diario`, que este
    # producto corre igual que la `0008` de arriba — ver el `command:` del
    # compose y `scripts/panel_admin.py`. `create_turno()` ahora rechaza abrir
    # un turno si la sucursal de la caja ya cerró el día.
    #
    # v1.122.0 -> v1.123.0 (2026-10-03): `get_config().clientes_dir` con precedencia `configure(clientes_dir=)` >
    # env `LIBRA_CLIENTES_DIR` > `repo_root/clientes` (el default no cambia). `scripts/nuevo_cliente.py` y
    # `scripts/panel_admin.py` lo leen de ahi (etapa 1 de wiki/analyses/sacar-clientes-del-arbol-del-repo.md).
    #
    # v1.118.0 -> v1.122.0 (2026-10-03): v1.122.0 es `libracore.testing.pg_por_worker`, el helper de TEST que
    # reemplaza el vaciado de la base entre tests por una base por worker de xdist restaurada desde plantillas
    # (reglas/ci.md del wiki). Subir el pin trae tambien v1.119.0 -> v1.121.0, todo de ARCA y con DOS migraciones
    # del motor (0014: FCE MiPyME y condicion de IVA del receptor; 0015: `facturas.cae_error`), que corren al
    # desplegar: ver el CHANGELOG de libracore.
    # v1.123.0 -> v1.124.0 (2026-10-04): una factura se acredita una sola vez (`POST /api/facturas/{id}/nota-credito` da 409 si ya tiene una nota) y la guarda del CUIT del receptor (`arca_wsfe.problema_del_receptor`, que `solicitar_cae` corre antes de llamar a ARCA). Sin migracion.
    # v1.124.0 -> v1.126.0 (2026-10-04): la nota de credito (`POST /api/facturas/{id}/nota-credito`) pasa a ser el nucleo `libracore.notas_de_credito`, igual para todos los productos y sin cambiar su comportamiento (el 422 por receptor invalido llega antes de numerar); la guarda del CUIT del receptor deja de bloquear las notas (ARCA autoriza la nota de credito a un CUIT que no cierra, igual que la factura), e incluye v1.125.0 (los routers de libracore rechazan booleanos en los campos numericos). Sin migracion.
    # v1.141.0 -> v1.142.0 (2026-10-07): credenciales y estado de ARCA por servicio web (`wscpe`, CTG y Carta de Porte); la facturacion no cambia. Migracion 0022 (tabla nueva `arca_credenciales_servicio`).
    # v1.142.0 -> v1.143.0 (2026-10-07): suma libracore.arca_wscpe (lectura de la Carta de Porte de ARCA, ADR-034); este producto no lo usa. Sin migracion.
    # v1.143.0 -> v1.144.0 (2026-10-08): suma la emision de la Carta de Porte (libracore.arca_wscpe, ADR-035); este producto no la usa. Sin migracion.
    # v1.144.0 -> v1.145.0 (2026-10-08): suma geografia.localidad(id) y GET /api/geo/localidades/{id}; este producto no los usa. Sin migracion.
    # v1.145.0 -> v1.146.0 (2026-10-08): el catalogo geografico suma el resto del Mercosur (geografia.paises, parametro pais; por omision Argentina). Sin migracion.
    # v1.146.0 -> v1.147.0 (2026-10-08): el pedido de certificado de ARCA se genera en el servidor (ADR-036 de libracore: rutas `.../pedido`; `GET .../servicios` suma `admite_pedido`). Sin migracion.
    # v1.147.0 -> v1.148.0 (2026-10-09): filtros de fecha por dia completo (`libracore.fechas`, ADR-037): una fila con hora del ultimo dia entra en reportes, listados y libros. Sin migracion.
    # v1.148.0 -> v1.149.0 (2026-10-09): en una demo (`DEMO_MODE=1`) la empresa es siempre ficticia: `config_manager.load()` pisa los datos de la empresa y `resolve_logo_path()` solo devuelve el logo de demo (ADR-038 de libracore). Fuera de una demo no cambia nada. Sin migracion.
    # v1.149.0 -> v1.150.0 (2026-10-09): `libracore-demo-codigos` (ADR-039): el reset de la demo guarda y devuelve los codigos de acceso. Sin migracion.
    # v1.150.0 -> v1.151.0 (2026-10-09): un plan retirado se resuelve con `PLANES_RETIRADOS` en el alta y en el cambio de plan (`provisioning.resolver_plan`, libracore#375). Este producto no retira planes: no cambia nada. Sin migracion.
    # v1.152.0 -> v1.153.0 (2026-10-10): sucursales contratadas y abono por unidad adicional (`libracore.limites` y `libracore.abono`, ADR-041). Sin dato de sucursales contratadas no limita nada; este producto no lo usa. Sin migracion.
    # v1.153.0 -> v1.154.0 (2026-10-12): `libracore.cuit.solo_digitos` y se retira `cc_resumen` (codigo muerto, nadie lo usaba). Sin migracion.
    # v1.154.0 -> v1.155.0 (2026-10-12): migracion 0024 retira cc_resumenes_enviados y clients.cc_resumen_* (ADR-042). Desplegar el producto ANTES de migrar.
    # v1.155.0 -> v1.157.0 (2026-10-12): `libracore.auditoria` (ADR-043): las escrituras de clients avisan a un registrador, apagado si el producto no lo configura. v1.156.0 es un tag erroneo, no usar. Sin migracion.
    # v1.157.0 -> v1.159.0 (2026-10-13): varios procesos (ADR-044: `libracore.candados`, la nota de credito con `conn=`) y el registro de errores (ADR-045: `libracore.errores.instalar_registro_de_errores`, `POST /api/errores-cliente`). Sin migracion. (La v1.156.0 es un tag erroneo: no usar.)
    # v1.159.0 -> v1.162.0 (2026-10-13): concepto sin «Factura» doble con migracion 0025 (corre al migrar, backup antes), alta por CLI con aviso de casilla y `panel_admin casilla`, se retira `get_cc_movimientos_periodo` y los adicionales quedan fuera de la escalera de planes (ADR-048, sin migracion).
    # v1.163.0 -> v1.164.0 (2026-10-14): cada envio por mail de un comprobante o un presupuesto deja rastro (`envios_email`, ADR-050 de libracore): `GET .../{id}/envios`, `envios_email` en el detalle y `envio_email` en el listado. **Migracion `0026_envios_email`** (tabla nueva) en la cadena de `libracore-migrar`.
    # v1.164.0 -> v1.166.0 (2026-10-14): incluye v1.165.0 (un proceso sin el almacen de secretos dice la causa) y `GET /api/facturas?envio=enviada|sin_enviar` filtra el listado por el rastro de envios por mail (ADR-051 de libracore). Sin migracion.
    # v1.167.0 -> v1.168.0 (2026-10-15, propuesta; ADR-053 de libracore): `libracore.docs_api.cerrar_docs_de_la_api`: `/docs`, `/redoc` y `/openapi.json` sólo con `ENV=development` (o `LIBRA_DOCS_API=1`); en un cliente real y en la demo dan 404. Sin migracion. `uv.lock` se regenera cuando exista el tag.
    # v1.168.0 -> v1.170.0 (2026-10-15): v1.169.0 suma `fk_de_producto.soltar_fk` (ADR-056; sin efecto en este producto, la usa LibraDesk) y v1.170.0 hace que `delete_client` bloquee la baja de un cliente con cuenta corriente (`cc_pagos`, `cc_debitos`, `recibos` y `cc_asientos` con rol cliente; ADR-057): desactivarlo en vez de borrarlo. Sin migracion.
    # v1.170.0 -> v1.173.0 (2026-10-16): v1.171.0 (ADR-058) no deja cobrar de mas una factura (409 con lo que falta); v1.172.0 (ADR-059 y ADR-060) las notas de credito con CAE restan de lo pendiente (`libracore.db.facturas.sql_pendiente`) y el cobro puede entrar por el turno (`build_comprobantes_router(exigir_turno=, usuario_del_turno=, validar_cobro=)`, `cobros.transaccion_de_cobro`); v1.173.0 (ADR-061, `libracore.demo`): una demo no habla con ARCA ni muestra datos fiscales reales y `usar_empresa_demo` rechaza un CUIT no ficticio. Sin migracion.
    # v1.173.0 -> v1.176.0 (2026-10-17): v1.174.0 `OpcionesCajas.sucursal_por_defecto` (ADR-062, opt-in); v1.175.0 el pago a cuenta corriente bloquea sus facturas en una transaccion (ADR-063) y la nota de debito tiene tope de cobro (ADR-064, 409 si se cobra de mas); v1.176.0 la NC de una factura al contado cobrada acepta `destino` devolver/a_favor (ADR-065, sin `destino` como antes). Sin migracion.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.176.0",
    # De LibraGenda se consume DOMINIO PURO, no persistencia: la recurrencia de
    # las canchas fijas y el solapamiento de intervalos. El motivo de no usar
    # sus repositorios esta en DECISIONS.md ADR-004.
    "libragenda @ git+https://github.com/marianocappucci/libragenda.git@v0.11.0",
    # El buffet (F4): catalogo, stock y ventas. Se consume el motor entero
    # —dominio, casos de uso y repositorio SQLite/PostgreSQL— y no solo el
    # dominio como en LibraGenda: aca no hay una persistencia propia que valga
    # la pena escribir, y VentaLibra ya probo ese camino.
    # v0.16.4 -> v0.63.0 (2026-10-16): LibraClub usa solo el repositorio, `confirm_sale` y el dominio. Lo que le toca: `RepositorioAuditado` pide un registrador de `libraauth` y no acepta `usuario=` (v0.57.0, ADR-050; ver `app/commerce.py`); `confirm_sale` rechaza un deposito inactivo o inexistente (ADR-051); `init_schema` se serializa entre procesos (v0.62.0, ADR-062, pide libracore>=1.168) y suma la tabla `branches`, vacia. La cadena de Alembic del motor (0002 a 0007) es de la capa ERP, que este producto no usa: no corre. Sin migracion.
    # v0.63.0 -> v0.64.0 (2026-10-17): `anular_venta` resta lo que las notas de credito ya devolvieron o dejaron a favor (ADR-064). Sin migracion.
    "libracommerce @ git+https://github.com/marianocappucci/libracommerce.git@v0.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # F3 (2026-09-05, reglas/ci.md del wiki): la suite corre en varios procesos,
    # una base por worker (tests/conftest.py).
    "pytest-xdist>=3.8",
    "httpx>=0.27",
    "ruff>=0.8",
    # Para leer el texto de los PDF del cierre diario en los tests (mismo
    # paquete que usa la propia suite de LibraCore para sus tickets).
    "pypdf>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.pytest.ini_options]
markers = [
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
show_missing = true
# Piso de cobertura. Es un TRINQUETE, no una meta: se fija 2 puntos por
# debajo de lo que el repo mide HOY (92%, medido en el CI del
# 2026-09-03), asi que pasa holgado y lo unico que puede ponerlo en rojo es
# una regresion. Cuando la cobertura suba de verdad, subir tambien este
# numero -- nunca bajarlo para que pase un cambio.
fail_under = 90
