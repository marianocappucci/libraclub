# Dependabot: avisa (por PR) cuando una dependencia de TERCEROS tiene una
# version nueva o un CVE. Agrupado por ecosistema para que sea
# UN PR por ecosistema, no uno por paquete. Los motores de la familia (libra*)
# se excluyen: van por tag de git y los propaga bump-motores (ver libra-bump).
# target-branch: develop en cada entrada (2026-09-06). Sin esto dependabot abre
# contra la rama default (main) y libra-bump lo mergea ahi, mientras todo lo
# demas entra por develop: la siguiente promocion develop -> main choca en el
# archivo que las dos ramas tocaron (paso en los ocho productos con ci.yml).
version: 2
updates:
  - package-ecosystem: "uv"
    target-branch: develop
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Los motores de la familia se pinean por tag de git y se propagan
      # con el workflow bump-motores (ver libra-bump), no por dependabot.
      - dependency-name: "libra*"
  - package-ecosystem: "npm"
    target-branch: develop
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Los motores de la familia se pinean por tag de git y se propagan
      # con el workflow bump-motores (ver libra-bump), no por dependabot.
      - dependency-name: "libra*"
      # 🔴 `vitest` y su proveedor de cobertura quedan en 3.x a proposito
      # (2026-09-08). `@vitest/coverage-v8` v5 cuenta las lineas de otra
      # manera --sobre los MISMOS archivos mide una fraccion de las lineas que
      # medía v3--, asi que el umbral de cobertura de este repo dejaria de
      # significar lo mismo, y no hay `include`/`exclude` que lo recupere.
      # Los dos van juntos: coverage-v8@3.2.7 pide vitest 3.2.7 exacto.
      # Se ignoran los MAJORS, no las correcciones dentro de 3.x.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    target-branch: develop
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
