name: CI

on:
  # Sin `push` a ramas: `develop` y `main` estan protegidas, asi que todo entra
  # por PR y el run del PR verifica el MERGE -- que es exactamente lo que queda
  # en la rama. El push repetia esa misma verificacion sobre un arbol identico.
  pull_request:
    branches: [develop, main]

# Una sola corrida viva por rama. Si entra un push nuevo mientras esta
# corriendo, se cancela la anterior en vez de pagar las dos: su resultado ya no
# le sirve a nadie, porque reporta sobre un codigo que no es el que quedo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # La MISMA imagen que producción (ver docker-compose.yml). No es un
        # detalle de tamaño: el collation viene de la imagen y `-alpine` ordena
        # por bytes, así que un `ORDER BY` sobre texto puede dar distinto. Un CI
        # verde sobre otra imagen no dice nada sobre producción.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: libraclub_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/libraclub_test
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El backup corre `pg_dump`/`pg_restore` de verdad, así que el runner los
      # necesita — y en la MISMA major que el servicio de arriba. No alcanza con
      # "que estén": `pg_restore` 17 contra un servidor 16 aborta el restore
      # entero. El `grep` convierte eso en un CI rojo hoy en vez de un botón roto
      # en producción.
      - name: Cliente de PostgreSQL (mismo major que el servicio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_restore --version
          pg_restore --version | grep -q ' 16\.'

      # Los repos de la familia vuelven a PRIVADO el 2026-09-01: sin
      # credenciales, `pip` no puede clonarlos y el build falla adentro del
      # install, con un error de git que no dice cual repo fallo.
      #
      # Una deploy key ES una identidad por repo, y con dos o mas cargadas SSH
      # las ofrece en orden: GitHub autentica con la primera que acepta, que
      # puede no ser la del repo que se esta clonando. Por eso el alias
      # `github-<repo>` con `IdentitiesOnly yes`, y no `github.com` a secas.
      #
      # Estructura generalizada (la misma de libradesk/gestiolibra/medlibra):
      # agregar una dependencia privada nueva es una linea de `configurar`.
      - name: Configurar acceso SSH a las dependencias privadas de Libra
        env:
          LIBRAAUTH_DEPLOY_KEY: ${{ secrets.LIBRAAUTH_DEPLOY_KEY }}
          LIBRACORE_DEPLOY_KEY: ${{ secrets.LIBRACORE_DEPLOY_KEY }}
          LIBRACOMMERCE_DEPLOY_KEY: ${{ secrets.LIBRACOMMERCE_DEPLOY_KEY }}
          LIBRAGENDA_DEPLOY_KEY: ${{ secrets.LIBRAGENDA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          configurar() {
            repo=$1; clave=$2
            if [ -z "$clave" ]; then
              echo "::error::Falta el secret con la deploy key de $repo en este repositorio."
              echo "Sin el, pip no puede clonar $repo (repo privado) y el build falla."
              echo "Es la clave privada de una deploy key de solo lectura sobre marianocappucci/$repo."
              exit 1
            fi
            printf '%s\n' "$clave" > ~/.ssh/id_"$repo"
            chmod 600 ~/.ssh/id_"$repo"
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_%s\n  IdentitiesOnly yes\n' \
              "$repo" "$repo" >> ~/.ssh/config
            git config --global \
              url."git@github-$repo:marianocappucci/$repo".insteadOf \
              "https://github.com/marianocappucci/$repo"
          }
          configurar libraauth "$LIBRAAUTH_DEPLOY_KEY"
          configurar libracore "$LIBRACORE_DEPLOY_KEY"
          configurar libracommerce "$LIBRACOMMERCE_DEPLOY_KEY"
          configurar libragenda "$LIBRAGENDA_DEPLOY_KEY"

      # Confirma que cada clave autentica contra SU repo y no contra otro: es
      # exactamente el modo de fallar que motiva los alias de arriba, y sin
      # este paso recien se notaria adentro del pip install.
      - name: Verificar que cada deploy key resuelve a su propio repo
        run: |
          for repo in libraauth libracore libracommerce libragenda; do
            saludo=$(ssh -o StrictHostKeyChecking=yes -T "git@github-$repo" 2>&1 || true)
            echo "$repo -> $saludo"
            case "$saludo" in
              *"marianocappucci/$repo"*) ;;
              *) echo "::error::La deploy key de $repo no resuelve a marianocappucci/$repo."; exit 1 ;;
            esac
          done

      # F1 (2026-09-05): el entorno sale de `uv.lock`, no de la resolucion del dia.
      # `--locked` falla si el lock no coincide con pyproject.toml: un pin que se
      # mueve sin regenerar el lock pone rojo aca, no en produccion. El venv entra
      # al PATH para que los pasos siguientes (ruff, pytest, alembic, scripts)
      # sigan invocandose igual que antes.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - name: Install package + dev deps (uv.lock)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check .

      # La suite corre contra PostgreSQL real. Nunca contra SQLite: la garantía
      # central de este producto es un constraint de exclusión GiST, que SQLite
      # ni siquiera tiene — una suite verde sobre SQLite estaría midiendo otro
      # producto.
      - name: Tests
        # `-rs` lista los tests SALTEADOS con su motivo. Sin eso, un módulo que
        # se saltea entero —por una dependencia que falta en el runner— deja el
        # job igual de verde que uno que corrió todo. Y en esta suite el módulo
        # que más importa es justamente el que necesita PostgreSQL.
        run: pytest -q -rs --cov=app --cov-report=term-missing

      # 🔑 El gate de F1 tiene que haber corrido de verdad, no haberse salteado.
      # Un `pytest` verde con cero tests de concurrencia se ve idéntico a uno con
      # los nueve — y la diferencia es toda la garantía del producto.
      #
      # 🔴 Se cuenta sobre el **JUnit XML** y no sobre la salida de texto de
      # pytest. La primera versión de este paso hacía
      # `--collect-only -q | tail -1 | grep 'N tests collected'`, y **habría
      # puesto el CI en rojo en el primer PR**: pytest 9 imprime un resumen
      # compacto (`tests/test_concurrencia.py: 9`) y una línea vacía al final,
      # así que el grep nunca matchea. El XML es formato estable y no cambia de
      # forma entre versiones.
      #
      # Se exige además `skipped="0"`: un módulo que se saltea entero —por una
      # dependencia que falta en el runner— deja el job igual de verde que uno
      # que corrió todo.
      - name: El gate de concurrencia corrio de verdad
        run: |
          pytest tests/test_concurrencia.py -q --junit-xml=gate.xml
          CORRIDOS=$(grep -o 'tests="[0-9]*"' gate.xml | head -1 | tr -dc '0-9')
          SALTEADOS=$(grep -o 'skipped="[0-9]*"' gate.xml | head -1 | tr -dc '0-9')
          echo "gate de concurrencia: $CORRIDOS corridos, $SALTEADOS salteados"
          test "$CORRIDOS" -ge 5
          test "$SALTEADOS" = "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, no `npm install`: instala exactamente lo del lock. Con
      # `install` el CI podría estar probando otras versiones que las que se
      # publican.
      # `libra-ui` vuelve a repo PRIVADO el 2026-09-01 y se instala por
      # git+https: sin credenciales `npm ci` falla al clonarlo. Mismo alias por
      # repo que el backend, y misma verificacion del saludo.
      - name: Configurar acceso a libra-ui
        env:
          LIBRA_UI_DEPLOY_KEY: ${{ secrets.LIBRA_UI_DEPLOY_KEY }}
        run: |
          if [ -z "$LIBRA_UI_DEPLOY_KEY" ]; then
            echo "::error::Falta el secret LIBRA_UI_DEPLOY_KEY en este repositorio."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$LIBRA_UI_DEPLOY_KEY" > ~/.ssh/id_libra_ui
          chmod 600 ~/.ssh/id_libra_ui
          printf 'Host github-libra-ui\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_libra_ui\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."git@github-libra-ui:marianocappucci/libra-ui".insteadOf "https://github.com/marianocappucci/libra-ui"
          saludo=$(ssh -o StrictHostKeyChecking=yes -T git@github-libra-ui 2>&1 || true)
          echo "libra-ui -> $saludo"
          case "$saludo" in
            *"marianocappucci/libra-ui"*) ;;
            *) echo "::error::La deploy key no resuelve a marianocappucci/libra-ui."; exit 1 ;;
          esac
        working-directory: .

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `--reporter=default` mantiene la salida legible en el log; el `junit`
      # agregado deja además el XML que lee el gate del paso siguiente. Los dos
      # reporters conviven: el `--outputFile.junit` le da destino sólo al
      # segundo.
      - name: Tests
        run: |
          rm -f vitest.xml
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=vitest.xml

      # 🔑 Mismo patrón que el gate de concurrencia del job de arriba, y por el
      # mismo motivo: que la suite haya CORRIDO no se deduce de que el paso
      # anterior haya salido en verde.
      #
      # 🔴 Lo que este gate agrega —y el exit code de `vitest run` NO cubre— son
      # los tests SALTEADOS. Medido el 2026-08-22 sobre vitest 3.2.7: un
      # `describe.skip` que envuelve la suite entera sale con **código 0**, así
      # que un módulo que se saltea completo deja el job igual de verde que uno
      # que corrió todo. Es el mismo agujero que el job de backend ya tapa
      # exigiendo `skipped="0"`.
      #
      # 🔴 `skipped` se cuenta por ocurrencias y no con `head -1`: el
      # `<testsuites>` raíz trae `tests`/`failures`/`errors` totales pero **no**
      # trae `skipped` — ese atributo vive en cada `<testsuite>`. Un `head -1`
      # leería el del primer archivo y daría por limpia una suite salteada más
      # abajo.
      #
      # `failures`/`errors` son hoy redundantes con el exit code de vitest (que
      # sí devuelve 1 con tests rojos — verificado con control positivo y
      # negativo el 2026-08-22). Se chequean igual porque salen gratis del mismo
      # XML y dejan de depender de que esa garantía siga valiendo.
      - name: La suite de frontend corrio de verdad
        run: |
          test -f vitest.xml
          CORRIDOS=$(grep -o 'tests="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          FALLADOS=$(grep -o 'failures="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          ERRORES=$(grep -o 'errors="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          SALTEADOS=$(grep -o '<skipped/>' vitest.xml | wc -l)
          echo "frontend: $CORRIDOS corridos, $FALLADOS fallados, $ERRORES con error, $SALTEADOS salteados"
          test -n "$CORRIDOS"
          test "$CORRIDOS" -gt 0
          test "$FALLADOS" = "0"
          test "$ERRORES" = "0"
          test "$SALTEADOS" = "0"

      - name: Build
        run: npm run build

      # 🔴 No es redundante con el paso de arriba. `npm run build` devuelve 0
      # aunque `tsc -b` haya fallado con errores y no haya escrito `dist/`. Sin
      # este chequeo el job queda verde habiendo producido nada, que es
      # exactamente lo que el job tiene que impedir.
      - name: El build dejo algo de verdad
        run: test -f dist/index.html
