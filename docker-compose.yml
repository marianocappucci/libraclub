# Instancia `dev` de LibraClub en el VPS, y entorno de desarrollo local.
#
# Mismo patrón que los `dev` del resto de la familia: NO es `panel_admin.py`
# —ese vive en LibraCore y provisiona instancias de CLIENTE bajo
# `clientes/<slug>/`—. Un compose, dos redes, y Nginx Proxy Manager alcanza al
# contenedor por su alias en la red compartida.

services:
  # 🔴 La clave del servicio lleva el nombre del producto y no es `db` ni
  # `postgres`: Compose convierte la clave en un alias de red, y `stack-net` la
  # comparte todo el VPS. Dos composes con la misma clave se turnan por
  # round-robin del DNS interno — ya pasó en esta familia, y el síntoma fue un
  # dominio de cliente sirviendo la demo.
  libraclub-postgres:
    # La MISMA imagen que el CI y que producción: el collation viene de la
    # imagen y la alpine ordena por bytes.
    image: postgres:16
    container_name: libraclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libraclub
      POSTGRES_USER: libraclub
      # Sin default a propósito: `:?` aborta el `up` si falta, en vez de
      # levantar la base con una clave escrita en git.
      POSTGRES_PASSWORD: ${LIBRACLUB_POSTGRES_PASSWORD:?hay que definirla en el .env}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - libraclub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libraclub -d libraclub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Sin `ports:` a propósito: sólo se llega desde la red interna.
    networks: [datos]

  libraclub-dev:
    build:
      context: .
    container_name: libraclub-dev
    depends_on:
      libraclub-postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    ports:
      # 🔴 El puerto del HOST tiene que ser único en el VPS, que corre ~65
      # contenedores. El 8098 —que era el valor original de este archivo— ya lo
      # usa `libracargo-suitrans`, y el 8097 `libracargo-dev`. Si dos composes
      # piden el mismo, el segundo `up` falla; y si alguien mide el servicio
      # equivocado, el puerto contesta igual y parece que anduvo.
      #
      # Al asignar uno nuevo, mirar lo que **está escuchando de verdad**
      # (`ss -ltn`) y no la lista de puertos que publica Docker: hay servicios
      # del VPS que escuchan sin ser contenedores.
      - "8099:8000"
    volumes:
      # El bind mount es para el `--reload` del código Python. Taparía el build
      # del frontend si viviera dentro de /app: por eso el Dockerfile lo hornea
      # en /opt/frontend-dist, fuera del árbol montado.
      - ./:/app
      # Los ZIP de backup, en un volumen propio y NO en el árbol montado de
      # arriba: ese árbol es el checkout de git del servidor, y dejarle archivos
      # nuevos adentro le complica el `git pull` del próximo deploy. Va después
      # del bind mount a propósito — el montaje más específico gana.
      - libraclub-datos:/app/data
    # 🔴 Las migraciones también acá, no sólo en el deploy. `cmd_actualizar`
    # las corre para las instancias de cliente y la demo, pero ESTA la levanta
    # el compose del repo y el motor no la toca. Se descubrió el 2026-08-25:
    # `libracargo-dev` estaba una revisión atrás del código que servía, con el
    # chequeo de salud en 200, y los cinco productos con Alembic tenían el
    # mismo hueco.
    #
    # Tiene que decir LO MISMO que `migraciones` en los dos scripts de
    # `scripts/`; hay un test que ata las dos puntas, porque el modo de fallar
    # de esto es que alguien agregue una cadena allá y se olvide acá.
    #
    # `exec` para que uvicorn quede como PID 1 y `docker stop` le llegue. Si la
    # migración falla el contenedor sale con error, que es mejor que servir
    # código nuevo sobre un esquema viejo.
    command: sh -c "alembic upgrade head && exec uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      # Las tres sin default: la app tiene que fallar al arrancar si falta
      # alguna, no levantar con un secreto de juguete en un dominio público.
      - SECRET_KEY=${SECRET_KEY:?hay que definirla en el .env}
      - LIBRACLUB_ADMIN_USERNAME=${LIBRACLUB_ADMIN_USERNAME:-admin}
      - LIBRACLUB_ADMIN_PASSWORD=${LIBRACLUB_ADMIN_PASSWORD:?hay que definirla en el .env}
      - DATABASE_URL=postgresql+psycopg://libraclub:${LIBRACLUB_POSTGRES_PASSWORD:?hay que definirla en el .env}@libraclub-postgres:5432/libraclub
      # 🔴 La base de LibraCore, SEPARADA de la del dominio y en el mismo
      # servidor. Separada porque `init_core_schema()` crea `usuarios` y
      # `auth_log`, que este producto ya tiene con la forma de `libraauth`:
      # compartiendo base nada falla al arrancar y libracore queda leyendo
      # tablas de otro motor. Mismo arreglo que Gestiolibra, MedLibra y
      # VentaLibra.
      #
      # No hace falta crearla a mano: la app la crea si no existe (ver
      # `servicios/facturacion.py`). Un paso manual acá tiraría el contenedor
      # al arrancar el dia que alguien se lo olvide.
      #
      # ⚠️ Con esto el backup pasa a llevarse las DOS bases. Un backup de una
      # sola no se puede restaurar y **no falla**: da un ZIP que pesa poco.
      - LIBRACLUB_LIBRACORE_DATABASE_URL=postgresql://libraclub:${LIBRACLUB_POSTGRES_PASSWORD:?hay que definirla en el .env}@libraclub-postgres:5432/libraclub_core
      - ENTORNO=dev
      # Como el backoffice (admin.libraclub.com.ar) administra los usuarios de
      # esta instancia, y como el panel del dueño pide `/admin/resumen`.
      # **Con default vacío a propósito**, al revés que las tres de arriba:
      # `libraauth` trata el token vacío como "no definido" y el endpoint se
      # comporta igual que si pidiera sesión de admin. O sea que no ponerlo no
      # abre nada; lo que abriría algo sería ponerle un valor adivinable, y por
      # eso no hay uno de ejemplo.
      - LIBRA_SERVICE_TOKEN=${LIBRA_SERVICE_TOKEN:-}
      # 🔴 **Credencial propia, distinta de `LIBRA_SERVICE_TOKEN`.** Aquél es
      # UN TOKEN POR PRODUCTO, compartido por todas sus instancias de
      # cliente: dárselo al dueño de un complejo le daría acceso de servicio
      # a las instancias de otros clientes del mismo producto. Éste es por
      # instancia, y si se filtra expone la lectura de agregados de UNA
      # sucursal. Ver wiki/analyses/panel-del-dueno-multisucursal.md, punto 7.
      - LIBRA_PANEL_TOKEN=${LIBRA_PANEL_TOKEN:-}
      # Dónde escribe los backups. Sin esto caen en `./data` relativo al
      # directorio de trabajo, o sea adentro del bind mount.
      - DATA_DIR=/app/data
      - TZ=America/Argentina/Buenos_Aires
    networks: [stack-net, datos]

volumes:
  libraclub-postgres-data:
  libraclub-datos:

networks:
  datos:
    name: libraclub-dev-datos
  # La red compartida del VPS, donde vive Nginx Proxy Manager. Es la que hace
  # que el proxy host pueda apuntar a `libraclub-dev:8000` por nombre.
  stack-net:
    external: true
    name: stack_stack-net
